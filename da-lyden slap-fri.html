<style>
  :root{
    --paper: #f7f4ec;
    --paper-panel: #ffffff;
    --ink: #2a2823;
    --muted: #6f6a5c;
    --line: #ddd6c4;
    --accent: #8a6d3b;
    --focus: #2b6cb0;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: Verdana, Arial, "Helvetica Neue", Helvetica, sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  a{ color: var(--accent); }
  header.top{ max-width: 760px; margin: 0 auto; padding: 48px 24px 20px; }
  header.top h1{ font-size: 2rem; margin: 0 0 10px; font-weight: 600; }
  header.top p{ margin: 0 0 14px; }
  main{ max-width: 1100px; margin: 0 auto; padding: 10px 24px 20px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .thumb{
    background: var(--paper-panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; cursor: pointer; padding: 0; text-align: left; font: inherit; color: inherit;
    display:block; width: 100%;
  }
  .thumb img{ display:block; width:100%; height: 160px; object-fit: cover; background: #eee9db; }
  .thumb .cap{ padding: 10px 12px; font-family: Verdana, Arial, sans-serif; font-size: 0.85rem; color: var(--muted); }
  .thumb:focus-visible, .lb-btn:focus-visible{ outline: 3px solid var(--focus); outline-offset: 2px; }

  .lightbox{
    position: fixed; inset: 0; background: rgba(20,18,14,0.94);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .lightbox.open{ display: flex; }
  .lightbox figure{ margin:0; max-width: min(90vw, 1000px); max-height: 92vh; display:flex; flex-direction: column; align-items:center; }
  .lightbox img{ max-width: 100%; max-height: 74vh; object-fit: contain; border-radius: 4px; background: #000; }
  .lightbox figcaption{
    color: #f3efe4; font-family: Verdana, Arial, sans-serif;
    font-size: 0.95rem; margin-top: 14px; max-width: 70ch; white-space: pre-line; text-align: center;
  }
  .lightbox figcaption b{ display:block; color: #fff; font-size: 1.05rem; margin-bottom: 4px; }
  .lb-btn{
    position: absolute; background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; width: 46px; height: 46px;
    font-size: 1.3rem; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .lb-btn:hover{ background: rgba(255,255,255,0.22); }
  .lb-close{ top: 18px; right: 18px; }
  .lb-prev{ left: 18px; top: 50%; transform: translateY(-50%); }
  .lb-next{ right: 18px; top: 50%; transform: translateY(-50%); }
  .empty-note{ color: var(--muted); font-style: italic; }

  details.meta-fold{ max-width: 760px; margin: 0 auto; padding: 10px 24px 60px; }
  details.meta-fold summary{
    cursor: pointer; list-style: none; font-weight: 600; font-size: 1rem;
    border-top: 1px solid var(--line); padding: 18px 0 4px 24px; position: relative;
  }
  details.meta-fold summary::-webkit-details-marker{ display: none; }
  details.meta-fold summary::before{
    content: '+'; position: absolute; left: 2px; top: 18px;
    color: var(--accent); font-weight: 700; width: 16px; text-align: center;
  }
  details.meta-fold[open] summary::before{ content: '\2212'; }
  details.meta-fold dl{ margin: 12px 0 0; font-size: 0.88rem; }
  details.meta-fold div.meta-row{
    display: grid; grid-template-columns: 190px 1fr; gap: 4px 14px;
    padding: 5px 0; border-bottom: 1px solid #ece6d8;
  }
  details.meta-fold dt{ color: var(--muted); }
  details.meta-fold dd{ margin: 0; }
  details.meta-fold .dc-tag{ color: #a39b88; font-size: 0.78rem; }
  @media (max-width: 640px){
    header.top{ padding: 32px 18px 14px; }
    header.top h1{ font-size: 1.5rem; }
    .lb-prev, .lb-next{ width: 40px; height: 40px; font-size: 1.1rem; }
    details.meta-fold div.meta-row{ grid-template-columns: 1fr; }
  }

<script>
var ALBUM = JSON.parse(document.getElementById('albumData').textContent);

document.title = ALBUM.album.name || 'Fotoalbum';
document.getElementById('albumTitleHeading').textContent = ALBUM.album.name || '';
document.getElementById('albumDesc').innerHTML = ALBUM.album.description || '';

var grid = document.getElementById('grid');
var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbCap = document.getElementById('lbCap');
var currentIndex = 0;
var lastFocused = null;

if(ALBUM.images.length === 0){
  grid.innerHTML = '<p class="empty-note">Ingen billeder endnu.</p>';
}

ALBUM.images.forEach(function(img, i){
  var btn = document.createElement('button');
  btn.className = 'thumb';
  btn.setAttribute('aria-label', 'Vis billede: ' + (img.title || ('billede ' + (i+1))));
  var picture = document.createElement('img');
  picture.src = img.src;
  picture.alt = '';
  picture.loading = 'lazy';
  var cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = img.title || ('Billede ' + (i+1));
  btn.appendChild(picture);
  btn.appendChild(cap);
  btn.addEventListener('click', function(){ openLightbox(i, btn); });
  grid.appendChild(btn);
});

/* --- Dublin Core-oversigt nederst --- */
var DC_LABELS = [
  ['title', 'Titel'],
  ['creator', 'Ophav'],
  ['subject', 'Emne'],
  ['description', 'Beskrivelse'],
  ['publisher', 'Udgiver'],
  ['contributor', 'Bidragyder'],
  ['date', 'Dato'],
  ['type', 'Type'],
  ['format', 'Format'],
  ['identifier', 'Identifikator'],
  ['source', 'Kilde'],
  ['language', 'Sprog'],
  ['relation', 'Relation'],
  ['coverage', 'Dækning'],
  ['rights', 'Rettigheder']
];

var dc = ALBUM.dublinCore || {};
var metaList = document.getElementById('metaList');
var shown = 0;
DC_LABELS.forEach(function(pair){
  var key = pair[0], label = pair[1];
  var val = (dc[key] || '').trim();
  if(!val) return;
  shown++;
  var row = document.createElement('div');
  row.className = 'meta-row';
  var dt = document.createElement('dt');
  dt.innerHTML = label + ' <span class="dc-tag">dc.' + key + '</span>';
  var dd = document.createElement('dd');
  dd.textContent = val;
  row.appendChild(dt);
  row.appendChild(dd);
  metaList.appendChild(row);
});
if(shown > 0) document.getElementById('metaFooter').hidden = false;

/* --- Lightbox --- */
function openLightbox(i, triggerEl){
  currentIndex = i;
  lastFocused = triggerEl || document.activeElement;
  showImage(i);
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.getElementById('lbClose').focus();
  document.addEventListener('keydown', onKeydown);
}

function closeLightbox(){
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  document.removeEventListener('keydown', onKeydown);
  if(lastFocused && lastFocused.focus) lastFocused.focus();
}

function showImage(i){
  var n = ALBUM.images.length;
  if(n === 0) return;
  currentIndex = (i + n) % n;
  var img = ALBUM.images[currentIndex];
  lbImg.src = img.src;
  lbImg.alt = img.title || '';
  var capHtml = '';
  if(img.title) capHtml += '<b>' + escapeHtml(img.title) + '</b>';
  if(img.description) capHtml += escapeHtml(img.description);
  lbCap.innerHTML = capHtml;
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function onKeydown(e){
  if(e.key === 'Escape') closeLightbox();
  else if(e.key === 'ArrowRight') showImage(currentIndex + 1);
  else if(e.key === 'ArrowLeft') showImage(currentIndex - 1);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', function(){ showImage(currentIndex + 1); });
document.getElementById('lbPrev').addEventListener('click', function(){ showImage(currentIndex - 1); });
lightbox.addEventListener('click', function(e){ if(e.target === lightbox) closeLightbox(); });
</script>
</body>
